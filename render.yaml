services:
  # ----------------------------------------------------------------------------
  # Unified Single Web Service (Streamlit Web UI + Embedded FastAPI Backend)
  # ----------------------------------------------------------------------------
  - type: web
    name: ai-clinical-streamlit
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "python -m streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: PYTHONPATH
        value: "./backend"
      - key: PYTHON_VERSION
        value: 3.11.8
